<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Race Derby — Browser Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🏇 HORSE RACE DERBY</h1>
    <div class="bank">
      Bankroll: <span id="balance">$500</span>
      &nbsp;·&nbsp; Wagered: <span id="total-bet">$0</span>
    </div>
  </header>

  <main>
    <canvas id="game" width="1280" height="720"></canvas>

    <section id="panel">
      <div id="betting-window">
        <div class="panel-head">
          <h2>Betting Window</h2>
          <label class="chip-label">Chip size:
            <select id="chip-select">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <button id="start-race" class="primary">🏇 START RACE</button>
          <button id="clear-bets">Clear Bets</button>
        </div>
        <div id="bet-rows"><!-- populated by JS --></div>
      </div>

      <aside id="sidebar">
        <h2>Memory &amp; Bank</h2>
        <p class="hint">
          Horses recall every past run (times, best line) and get faster with
          experience. Memory is saved in this browser between races.
        </p>
        <button id="wipe-memory" class="danger">🧠 Wipe All Horse Memory</button>
        <label class="chk">
          <input type="checkbox" id="wipe-on-exit" checked />
          Wipe all memory when the program is exited / tab closed
        </label>
        <button id="reset-bank">Reset Bankroll ($500)</button>
        <h3>Recent Payouts</h3>
        <ul id="bet-log"></ul>
      </aside>
    </section>

    <footer id="status-line">Loading…</footer>
  </main>

  <!-- Loading overlay: visible instantly, removed as soon as the game's
       first frame paints. Heavy setup (pathfinding caches, track render)
       runs AFTER first paint so this never blocks for minutes. -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">Preparing the derby…</p>
  </div>

  <script>
    // Watchdog: if the game module never boots (network hiccup, old browser
    // without ES-module support, syntax error), don't leave the user staring
    // at a spinner for minutes — show a clear message after 8 seconds.
    window.__derbyBooted = false;
    setTimeout(function () {
      if (window.__derbyBooted) return;
      var t = document.getElementById('loading-text');
      if (t && !t.dataset.msg) {
        t.dataset.msg = '1';
        t.innerHTML = 'The game failed to start.<br>' +
          'Try refreshing the page, or serve this folder over HTTP ' +
          '(<code>python3 -m http.server</code> in the <code>web/</code> directory).';
      }
    }, 8000);
  </script>
  <script type="module">
    import { DerbyGame } from './js/main.js';

    const status = document.getElementById('status-line');
    const overlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    // Defer module evaluation work to the next macrotask so the HTML above
    // paints before any game code runs.
    setTimeout(() => {
      try {
        const game = new DerbyGame(document.getElementById('game'));
        game.enableAutoWipeOnExit(); // default: wipe memory on exit (checkbox reflects it)
        game.start();
        window.__derby = game; // handy for debugging
        window.__derbyBooted = true;
      } catch (err) {
        console.error(err);
        loadingText.textContent = 'Failed to start: ' + err.message;
        status.textContent = 'Error starting game — see console.';
        return;
      }
      // Hide the overlay once the first frame has actually been drawn.
      // (main.js also hides it right after its own first painted frame.)
      requestAnimationFrame(() => requestAnimationFrame(() => {
        overlay.classList.add('hidden');
        status.textContent = 'Ready.';
      }));
    }, 0);
  </script>
</body>
</html>
